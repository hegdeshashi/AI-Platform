apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
      - name: myapp

        image: myacr.azurecr.io/myapp:v1

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"

          limits:
            cpu: "1000m"
            memory: "1Gi"

        livenessProbe:
          httpGet:
            path: /health
            port: 8080

          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 8080

          initialDelaySeconds: 15
          periodSeconds: 10
